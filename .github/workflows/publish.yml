# Publishes this n8n community node package to npm when a version tag is pushed.
#
# MODEL: the tag is the single source of truth for the version. You create a
# tag named after the version (e.g. 0.2.0), push it, and this workflow writes
# that version into package.json, builds, publishes to npm with provenance,
# and commits the version bump back to master.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
#   git tag 0.2.0
#   git push origin 0.2.0
#
# That's it. The workflow does the rest (bump package.json, build, publish,
# commit the bump back to master).
#
# ─── PREREQUISITES ─────────────────────────────────────────────────────────────
#
# @n8n/node-cli ≥ 0.23.0 is required (its `release` command runs lint + build
# and publishes with provenance in CI). Check with `npm list @n8n/node-cli`;
# upgrade with `npm install --save-dev @n8n/node-cli@latest`.
#
# ─── ONE-TIME SETUP (npm auth) ─────────────────────────────────────────────────
#
# Option A — OIDC Trusted Publishing (recommended, no long-lived secrets):
#   1. Log in to npmjs.com and open your package's settings.
#   2. Under "Publish access" → "Trusted Publishers", click "Add a publisher".
#   3. Select GitHub Actions and fill in:
#        Repository owner: biela-kamil
#        Repository name:  n8n-open-project
#        Workflow name:    publish.yml
#        Environment:      (leave blank unless you use GitHub Environments)
#   4. Leave the NPM_TOKEN secret unset. GitHub's OIDC token is used instead.
#
# Option B — npm Automation Token (fallback):
#   1. On npmjs.com: Access Tokens → Generate New Token → Granular Access Token,
#      scoped to this package with "Read and write" publish permission.
#   2. In GitHub: Settings → Secrets and variables → Actions → New secret named
#      NPM_TOKEN.
#
# ─── BRANCH PROTECTION NOTE ────────────────────────────────────────────────────
#
# The final step pushes a "chore: release" commit to master. If master has
# branch protection that blocks direct pushes, either allow github-actions[bot]
# to bypass it, or remove the commit-back step.
#
# ─── TAG CONVENTION ────────────────────────────────────────────────────────────
#
# Triggers on tags matching "*.*.*" (e.g. 0.2.0). For a "v" prefix (v0.2.0),
# change the filter to 'v*.*.*' AND strip the "v" when setting the version
# (e.g. VERSION="${GITHUB_REF_NAME#v}").

name: Publish

on:
  push:
    tags:
      - '*.*.*'

# Avoid concurrent releases stepping on each other when pushing back to master.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint an OIDC token for npm provenance attestation.
      id-token: write
      # Required to push the version-bump commit back to master.
      contents: write

    steps:
      # Check out master (not the detached tag) so we can commit the bump back.
      - uses: actions/checkout@v7
        with:
          ref: master

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set version from tag
        # The tag name is the version. Write it into package.json without
        # creating another git tag. --allow-same-version keeps re-runs idempotent.
        run: npm version "$GITHUB_REF_NAME" --no-git-tag-version --allow-same-version

      - name: Publish to npm
        # `npm run release` (n8n-node release) auto-detects GitHub Actions and
        # runs lint + build, then `npm publish` with provenance enabled
        # (NPM_CONFIG_PROVENANCE=true) and RELEASE_MODE=true. RELEASE_MODE is
        # required: the package's prepublishOnly hook (n8n-node prerelease)
        # deliberately blocks a bare `npm publish` and only allows it when
        # RELEASE_MODE is set. In CI this command does NOT commit/tag/push.
        # Publish access (public) comes from publishConfig in package.json.
        # Option A (OIDC): leave NPM_TOKEN unset — npm uses the OIDC exchange.
        # Option B (token): set NPM_TOKEN — setup-node writes it to .npmrc.
        run: npm run release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump back to master
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No version change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: release $GITHUB_REF_NAME" -- package.json package-lock.json
          git push origin HEAD:master